# OpenRouter endpoint and key are supplied by DEEPSEEK_* in .env.
id: deepseek
display_name: DeepSeek V4.1 Flash (OpenRouter)
adapter: openai-compatible
base_url: https://openrouter.ai/api/v1
base_url_env: DEEPSEEK_BASE_URL
api_key_env: DEEPSEEK_API_KEY
model_env: DEEPSEEK_MODEL
model: deepseek/deepseek-v4.1-flash
structured_output: false
max_output_tokens: 16000
token_param: max_tokens
# Fixed high reasoning effort for the official benchmark.
reasoning_effort: high
reasoning_api: openai
reasoning_style: nested
# temperature omitted: provider default.
# Prefer OpenRouter's per-request USD charge; YAML rates are a fallback.
cost_source: provider
# Fallback prices in USD per 1k tokens, verified 2026-09-29:
# https://openrouter.ai/api/v1/models/deepseek/deepseek-v4.1-flash/endpoints
# Automatic routing: use the highest listed rates when usage.cost is missing.
# Relace's $0.02/$0.60 per 1M headline does not apply to every provider.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.00045
price_cached_1k_tokens: 0.000045
price_output_1k_tokens: 0.0018
timeout_s: 180
notes: "Vision via OpenRouter; high reasoning. Costs use reported USD charges, with conservative provider-rate estimates only when charges are missing."
