# Model registry: one file per model. Secrets ONLY via env (never committed).
# Cheapest way to test: Google AI Studio key (free tier available, then PAYG).
# Get one at https://aistudio.google.com/apikey — export GEMINI_API_KEY.
id: gemini
display_name: Gemini 3.8 Flash (AI Studio, OpenAI-compatible)
adapter: openai-compatible
base_url: https://generativelanguage.googleapis.com/v1beta/openai
base_url_env: GEMINI_BASE_URL
api_key_env: GEMINI_API_KEY
model_env: GEMINI_MODEL
model: gemini-3.8-flash
# Open-ended animal identification; no candidate list is sent.
structured_output: false
reasoning_effort: high
max_output_tokens: 16000
token_param: max_tokens
# Google maps reasoning_effort low/medium/high to Gemini thinking levels.
# https://ai.google.dev/gemini-api/docs/openai#thinking
reasoning_api: openai
reasoning_style: flat
# temperature omitted (provider default)
# Pricing in USD per 1k tokens (no per-request fee).
# Gemini 3.8 Flash standard paid tier, verified 2026-09-10:
# https://ai.google.dev/gemini-api/docs/pricing#gemini-3.8-flash
# Introductory rates through 2026-12-31; output includes thinking tokens.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.00075
price_cached_1k_tokens: 0.000075
price_output_1k_tokens: 0.00375
# Request timeout.
timeout_s: 180
notes: "Gemini 3.8 Flash; low/medium/high reasoning. Standard paid-tier prices through 2026-12-31; update rates for 2027 runs."
