id: luna
display_name: GPT-6 Luna (vision, Azure)
adapter: openai-compatible
base_url_env: GPT6_LUNA_BASE_URL
api_key_env: GPT6_LUNA_API_KEY
model_env: GPT6_LUNA_MODEL
model: gpt-6-luna
structured_output: false
reasoning_effort: high
max_output_tokens: 16000
token_param: max_completion_tokens
# Reference OpenAI standard pricing, USD per 1k tokens. Azure contract may differ.
# https://developers.openai.com/api/docs/models/gpt-6-luna
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.0001
price_cached_1k_tokens: 0.00001
price_output_1k_tokens: 0.0005
timeout_s: 120
notes: GPT-6 Luna standard pricing reference; verify against Azure contract.
