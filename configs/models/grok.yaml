# Model registry: one file per model. Secrets ONLY via env (never committed).
# OpenRouter key: https://openrouter.ai/keys — export OPENROUTER_API_KEY.
id: grok
display_name: Grok 4.6 (OpenRouter)
adapter: openai-compatible
base_url: https://openrouter.ai/api/v1
base_url_env: OPENROUTER_BASE_URL
api_key_env: OPENROUTER_API_KEY
model_env: GROK_MODEL
model: x-ai/grok-4.6
max_output_tokens: 16000
token_param: max_tokens
structured_output: false
reasoning_effort: high
reasoning_style: nested # OpenRouter shape; xAI native is flat
# temperature omitted: provider default until tested
cost_source: provider
# Fallback USD per 1k tokens: highest listed rates, verified 2026-09-29.
# https://openrouter.ai/api/v1/models/x-ai/grok-4.6/endpoints
# OpenRouter's reported usage.cost takes precedence.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.004
price_cached_1k_tokens: 0.001
price_output_1k_tokens: 0.012
# Request timeout.
timeout_s: 180
notes: OpenRouter reported USD charges take precedence; conservative fallback rates verified 2026-09-29.
