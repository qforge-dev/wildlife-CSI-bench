# Model registry: one file per model. Secrets ONLY via env (never committed).
id: astra
display_name: Astra (vision)
adapter: openai-compatible
# Set your own endpoint and credentials through the variables below.
base_url_env: ASTRA_BASE_URL
api_key_env: ASTRA_API_KEY
model_env: ASTRA_MODEL
model: gpt-6-astra
# Open-ended animal identification; no candidate list is sent.
structured_output: false
reasoning_effort: high
reasoning_api: openai
reasoning_style: flat
max_output_tokens: 16000
token_param: max_completion_tokens
# temperature omitted: GPT-6 Astra does not support sampling parameters.
# Pricing in USD per 1k tokens (no per-request fee on Azure/OpenAI).
# Source: https://developers.openai.com/api/docs/models/gpt-6-astra
# OpenAI standard short-context rates, verified 2026-09-11:
# $10.00/1M input, $1.00/1M cached input, $50.00/1M output including reasoning.
# Reference estimates for --max-cost; actual Azure contract rates may differ.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.01
price_cached_1k_tokens: 0.001
price_output_1k_tokens: 0.05
# Request timeout.
timeout_s: 120
notes: OpenAI standard pricing reference verified 2026-09-11; actual Azure contract rates may differ.
