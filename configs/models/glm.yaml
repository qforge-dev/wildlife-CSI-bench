# OpenRouter endpoint and key are supplied by GLM_* in .env.
id: glm
display_name: GLM 5.3 Flash (OpenRouter)
adapter: openai-compatible
base_url: https://openrouter.ai/api/v1
base_url_env: GLM_BASE_URL
api_key_env: GLM_API_KEY
model_env: GLM_MODEL
model: z-ai/glm-5.3-flash
structured_output: false
max_output_tokens: 16000
token_param: max_tokens
# Fixed high reasoning effort for the official benchmark.
reasoning_effort: high
reasoning_api: openai
reasoning_style: nested
# temperature omitted: provider default.
cost_source: provider
# Fallback prices in USD per 1k tokens, verified 2026-09-29:
# https://openrouter.ai/api/v1/models/z-ai/glm-5.3-flash/endpoints
# Automatic routing: use the highest listed rates when usage.cost is missing.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.00075
price_cached_1k_tokens: 0.00005
price_output_1k_tokens: 0.001
timeout_s: 180
notes: "Vision via OpenRouter; high reasoning. Costs use reported USD charges, with conservative provider-rate estimates only when charges are missing."
