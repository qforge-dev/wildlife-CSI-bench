[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-csi"
version = "0.0.1"
description = "Wildlife CSI: open-ended animal-trace identification benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "boto3>=1.34",
  "botocore[crt]>=1.34",
]

[project.scripts]
csi = "wildlife_csi.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
